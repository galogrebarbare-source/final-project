<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./shopall.css">
    <link rel="stylesheet" href="./header.css">
</head>
<body>

<header class="site-header">
        <div class="header-container">
            
            
            <div class="logo-box">
                <a href="#" class="logo">dreama.</a>
            </div>

            
            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="#">Shop All</a></li>
                    <li><a href="#">Cleanse</a></li>
                    <li><a href="#">Hydrate</a></li>
                    <li><a href="#">Protect</a></li>
                    <li><a href="#">New Arrivals</a></li>
                    <li><a href="#">Our Story</a></li>
                </ul>
            </nav>
           
            <div class="header-actions">
                <a href="#" class="login-link">
                  
                    <svg class="svg-inline--fa fa-circle-user" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <path d="M39 384.2C376.9 345.8 335.4 320 288 320H224c-47.4 0-88.9 25.8-111 64.2c35.2 39.2 86.2 63.8 143 63.8s107.8-24.7 143-63.8zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm256 16a72 72 0 1 0 0-144 72 72 0 1 0 0 144z"/>
                    </svg>
                    <span>Log In</span>
                </a>

                <a href="#" class="cart-box">
                   
                    <svg class="svg-inline--fa fa-basket-shopping" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512">
                        <path d="M253.3 35.1c6.1-11.8 1.5-26.3-10.2-32.4s-26.3-1.5-32.4 10.2L117.6 192H32c-17.7 0-32 14.3-32 32s14.3 32 32 32L83.9 463.5C91 492 116.6 512 146 512H430c29.4 0 55-20 62.1-48.5L544 256c17.7 0 32-14.3 32-32s-14.3-32-32-32H458.4L365.3 12.9C359.2 1.2 344.7-3.4 332.9 2.7s-16.3 20.6-10.2 32.4L404.3 192H171.7L253.3 35.1zM192 304v96c0 8.8-7.2 16-16 16s-16-7.2-16-16V304c0-8.8 7.2-16 16-16s16 7.2 16 16zm96-16c8.8 0 16 7.2 16 16v96c0 8.8-7.2 16-16 16s-16-7.2-16-16V304c0-8.8 7.2-16 16-16zm128 16v96c0 8.8-7.2 16-16 16s-16-7.2-16-16V304c0-8.8 7.2-16 16-16s16 7.2 16 16z"/>
                    </svg>
                    <span class="cart-badge">0</span>
                </a>
            </div>

        </div>
    </header> 
    

   <div class="shop-container">
  
  
  <div class="top-wrapper">
    <div class="breadcrumb">
      Home <span class="arrow">></span> All Products
    </div>
    <div class="page-title">All Products</div>
  </div>

 
  <div class="banner">
    
    <img src="./images/banner.avif" alt="All Products Banner">
  </div>

  
  <div class="main-content-layout">
    
    
    <div class="sidebar">
      <div class="filter-section">
        <div class="filter-group-title">Browse by</div>
        <a href="./" class="filter-link active">All Products</a>
        <a href="./cleanse.html" class="filter-link">Cleanse</a>
        <a href="./hydrate.html" class="filter-link">Hydrate</a>
        <a href="#" class="filter-link">Protect</a>
      </div>
      
      <div class="filter-section">
        <div class="filter-group-title">Filter by</div>
        <div class="price-header">
          <span>Price</span>
          <span>–</span>
        </div>
       
        <div class="price-slider">
          <div class="slider-dot"></div>
          <div class="slider-line"></div>
          <div class="slider-dot"></div>
        </div>
        
        <div class="price-values">
          <span>$15</span>
          <span>$60</span>
        </div>
      </div>
    </div>

    
    <div class="products-section">
      <div class="products-header">
        <div class="products-count">18 products</div>
        <div class="sort-box">
          Sort by: Recommended <span class="down-arrow">⌄</span>
        </div>
      </div>

      
      <div class="products-grid">
        
       
        <div class="product-card">
          <div class="product-image-box">
            
            <img src="./images/cream1.avif" alt="Product 1">
          </div>
        </div>

      
        <div class="product-card">
          <div class="product-image-box">
          
            <img src="./images/cream2.avif" alt="Product 2">
          </div>
        </div>

        
        <div class="product-card">
          <div class="product-image-box">
            <div class="badge-container">
              <span class="badge">Bestseller</span>
            </div>
           
            <img src="./images/cream3.avif" alt="Product 3">
          </div>
        </div>

      </div>
    </div>

    
</body>
</html>
