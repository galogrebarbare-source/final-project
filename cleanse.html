<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleanse</title>
    <link rel="stylesheet" href="./cleanse.css">
</head>
<body>

    <div class="page-wrapper">
        
    
        <div class="top-header">
            <div class="breadcrumb">Home <span>&gt;</span> Cleanse</div>
            <h1 class="page-title">Cleanse</h1>
        </div>

    
        <div class="main-layout">
            
        
            <div class="sidebar">
                
                <div class="sidebar-block">
                    <div class="sidebar-heading">Browse by</div>
                    <div class="menu-list">
                        <div class="menu-item">All Products</div>
                        <div class="menu-item active">Cleanse</div>
                        <div class="menu-item">Hydrate</div>
                        <div class="menu-item">Protect</div>
                    </div>
                </div>

                <div class="sidebar-block">
                    <div class="sidebar-heading">Filter by</div>
                    
                
                    <div class="filter-box">
                        <div class="filter-title-row">
                            <span>Price</span>
                            <span class="symbol">&minus;</span>
                        </div>
                        <div class="slider-wrapper">
                            <input type="range" min="20" max="35" value="35" class="price-range">
                            <div class="price-limits">
                                <span>$20</span>
                                <span>$35</span>
                            </div>
                        </div>
                    </div>

                
                    <div class="filter-box">
                        <div class="filter-title-row">
                            <span>Formula</span>
                            <span class="symbol">+</span>
                        </div>
                    </div>

                    <div class="filter-box">
                        <div class="filter-title-row">
                            <span>Size</span>
                            <span class="symbol">+</span>
                        </div>
                    </div>

                    <div class="filter-box">
                        <div class="filter-title-row">
                            <span>Skin Type</span>
                            <span class="symbol">+</span>
                        </div>
                    </div>

                </div>
            </div>

        
            <div class="products-area">
                
                <div class="toolbar">
                    <div class="count-text">6 products</div>
                    <div class="sort-text">Sort by: Recommended <span class="arrow">&#8964;</span></div>
                </div>

                <div class="products-row">
                    
                
                    <div class="product-item">
                        <div class="image-frame">
                            <img src="./images/1.avif" alt="Cloud Cream Wash">
                        </div>
                        <div class="product-details">
                            <div class="product-name">Cloud Cream Wash</div>
                            <div class="price-row">
                                <span class="old-price">$26.00</span>
                                <span class="sale-price">$22.00</span>
                            </div>
                            <div class="options-row">
                                <div class="option-pill">Dry</div>
                                <div class="option-pill">Oily</div>
                            </div>
                        </div>
                    </div>

                    <!-- პროდუქტი 2 -->
                    <div class="product-item">
                        <div class="image-frame">
                            <img src="./images/2.avif" alt="Jelly Splash Face Wash">
                        </div>
                        <div class="product-details">
                            <div class="product-name">Jelly Splash Face Wash</div>
                            <div class="price-row">
                                <span class="normal-price">$25.00</span>
                            </div>
                            <div class="options-row">
                                <div class="option-pill">150ml</div>
                                <div class="option-pill">300ml</div>
                            </div>
                        </div>
                    </div>

                   
                    <div class="product-item">
                        <div class="image-frame">
                            <img src="./images/3.avif" alt="Melt Away Cleansing Balm">
                        </div>
                        <div class="product-details">
                            <div class="product-name">Melt Away Cleansing Balm</div>
                            <div class="price-row">
                                <span class="old-price">$35.00</span>
                                <span class="sale-price">$30.00</span>
                            </div>
                            <div class="options-row">
                                <div class="option-pill">50ml</div>
                                <div class="option-pill">100ml</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
